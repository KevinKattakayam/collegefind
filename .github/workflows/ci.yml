name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: collegefind_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/collegefind_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/collegefind_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/collegefind_test
      NEXTAUTH_SECRET: ci-secret-value-that-is-at-least-32-chars
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify disposable database identity
        env:
          PGPASSWORD: postgres
        run: |
          test "$(psql -h localhost -U postgres -d collegefind_test -Atqc "SELECT current_database() || '|' || current_user || '|' || (SELECT count(*) FROM information_schema.tables WHERE table_schema='public')")" = 'collegefind_test|postgres|0'
          createdb -h localhost -U postgres collegefind_upgrade_test
          createdb -h localhost -U postgres collegefind_restore_test
          createdb -h localhost -U postgres collegefind_e2e_test
          test "$(psql -h localhost -U postgres -d collegefind_e2e_test -Atqc "SELECT current_database() || '|' || current_user || '|' || (SELECT count(*) FROM information_schema.tables WHERE table_schema='public')")" = 'collegefind_e2e_test|postgres|0'

      - name: Check formatting of the Prisma schema
        run: npx prisma format && git diff --exit-code prisma/schema.prisma

      - name: Verify migrations match the schema
        # Fails if someone edited schema.prisma without adding a migration.
        # Prisma 7 reads the shadow database from prisma.config.ts.
        env:
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/collegefind_shadow
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE collegefind_shadow'
          npx prisma migrate deploy
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema prisma/schema.prisma \
            --exit-code
          echo "Schema and migrations agree"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Integration tests
        env:
          COLLEGEFIND_TEST_DATABASE_CONFIRMED: 'true'
        run: npm run test:integration

      - name: Upgrade and restore rehearsal
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/collegefind_upgrade_test
          COLLEGEFIND_TEST_DATABASE_CONFIRMED: 'true'
          RESTORE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/collegefind_restore_test
        run: bash scripts/rehearse-release-recovery.sh

      - name: Seed isolated browser database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/collegefind_e2e_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/collegefind_e2e_test
          SEED_SYNTHETIC_CUTOFFS: 'true'
        run: |
          npx prisma migrate deploy
          npm run db:seed

      - name: Build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/collegefind_e2e_test
        run: npm run vercel-build

      - name: Browser tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/collegefind_e2e_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/collegefind_e2e_test
          COLLEGEFIND_TEST_DATABASE_CONFIRMED: 'true'
          NEXTAUTH_URL: http://127.0.0.1:3100
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e -- --workers=2 --project=chromium
          npm run test:e2e -- --workers=2 --project=mobile

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Scan for committed secrets
        # Scan the current tree and report only paths and line numbers.
        run: |
          python3 scripts/check-release-secrets.py

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
